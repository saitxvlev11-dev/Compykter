<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Center — Личный дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #090d0c;
    --bg-gradient: radial-gradient(circle at 15% 15%, rgba(16, 46, 38, 0.45) 0%, rgba(9, 13, 12, 0.95) 55%),
                   radial-gradient(circle at 85% 85%, rgba(20, 38, 48, 0.4) 0%, rgba(9, 13, 12, 1) 60%);
    --card-bg: rgba(18, 24, 23, 0.78);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-border-hover: rgba(255, 255, 255, 0.16);
    --text-main: #edf2f0;
    --text-muted: #869691;
    --text-dim: #54635e;
    --accent-green: #22c55e;
    --accent-teal: #14b8a6;
    --accent-orange: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #a855f7;
    --radius-lg: 16px;
    --radius-md: 10px;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-base);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

  .dashboard {
    display: grid;
    grid-template-columns: 1.15fr 0.95fr 1.15fr;
    gap: 16px;
    width: 100vw;
    height: 100vh;
    padding: 16px;
  }

  .column {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    transition: border-color 0.2s ease;
    min-height: 0;
  }

  .card
